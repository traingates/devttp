<!DOCTYPE html>
<html lang="en">
<head>

          <img src="asset/color-ttp-47.png" alt="logo">

          <button class="sign-in-btn">Sign In</button>
          <img src="asset/union-1-44.svg" alt="user" class="user-icon">
        </div>
      </div>
    </nav>

    <!-- Cover Section -->
    <section class="cover">
      <img src="asset/cover-2.png" alt="cover" class="cover-image">
      <div class="dimmer"></div>
      <div class="author">Photographed by: Kyle Lau</div>
    </section>

    <!-- Footer Navigation -->
    <footer class="navigation-footer">
      <div class="footer-content">
        <div class="footer-column">
          <div class="footer-title">Topic</div>
          <div class="footer-link">Page</div>

        <div class="footer-column">

          <div class="footer-link">Page</div>
          <div class="footer-link">Page</div>
          <div class="footer-link">Page</div>
        </div>
        <div class="footer-branding">
          <div class="site-name">Site name</div>
          <div class="social-icons">
            <img src="asset/icon-23.svg" alt="social">
            <img src="asset/icon-26.svg" alt="social">
            <img src="asset/icon-29.svg" alt="social">
            <img src="asset/icon-32.svg" alt="social">
          </div>
        </div>
      </div>
      <img src="asset/divider-33.svg" alt="divider" class="divider">
    </footer>

    <!-- Main Content -->
    <section class="main-content">
      <div class="title-section">
        <h1 class="header">The Traingates Project's</h1>
        <p class="subheader">A member of Kalen Rewards.</p>

      <div class="buttons-section">

        <button class="btn">Membership</button>
        <button class="btn">Affiliation</button>

        <button class="btn">Portfolio</button>
        <button class="btn">Products</button>

      <div class="info-box">
